services:
  caddy:
    build: ./web
    container_name: whoami-caddy
    restart: unless-stopped
    ports:
      - "${HTTP_IP_BIND:-8080}:80"
    environment:
      - IPV4_HOST=${IPV4_HOST}
      - IPV6_HOST=${IPV6_HOST}
    volumes:
      - ./web/caddy:/etc/caddy
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
      args:
        - MAXMIND_ACCOUNT_ID=${MAXMIND_ACCOUNT_ID}
        - MAXMIND_LICENSE_KEY=${MAXMIND_LICENSE_KEY}
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./api:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DNS_ZONE=${DNS_ZONE:-dns.whoami.local}
      - IPV4_HOST=${IPV4_HOST}
      - IPV6_HOST=${IPV6_HOST}
    depends_on:
      - redis

  redis:
    image: redis:alpine
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
