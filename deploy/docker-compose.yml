services:
  web:
    image: ghcr.io/50512/whoami-web:${IMAGE_TAG:-latest}
    container_name: whoami-diag
    restart: unless-stopped
    environment:
      - IPV4_HOST=${IPV4_HOST}
      - IPV6_HOST=${IPV6_HOST}
      - MAIN_HOST=${MAIN_HOST}
      - LEAK_ZONE=${DNS_ZONE}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES}
      - TRUSTED_HEADERS=${TRUSTED_HEADERS}
    depends_on:
      - api
    networks:
      - admin_public_network
      - default

  api:
    image: ghcr.io/50512/whoami-api:${IMAGE_TAG:-latest}
    container_name: whoami-api
    restart: unless-stopped
    volumes:
      - geoip_data:/var/opt/GeoIP
      - whoami_data:/data
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DNS_ZONE=${DNS_ZONE}
      - IPV4_HOST=${IPV4_HOST}
      - IPV6_HOST=${IPV6_HOST}
      - GEOIP_PATH=/var/opt/GeoIP
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FILE=/var/log/whoami/api.log
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    tmpfs:
      - /var/log/whoami:size=32m,mode=0700
    depends_on:
      - redis
      - geoipupdate

  dns:
    image: ghcr.io/50512/whoami-dns:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${DNS_PORT:-5353}:53/udp" # host 5353 → contenedor 53/udp
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DNS_ZONE=${DNS_ZONE:-dns-leak.host.com}
      - DNS_PORT=53 # dentro del contenedor escucha en 53
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FILE=/var/log/whoami/dns.log
    tmpfs:
      - /var/log/whoami:size=32m,mode=0700
    depends_on:
      - redis

  geoipupdate:
    image: ghcr.io/maxmind/geoipupdate:latest
    container_name: whoami-geoip-updater
    restart: unless-stopped
    volumes:
      - geoip_data:/var/opt/GeoIP
    environment:
      - GEOIPUPDATE_ACCOUNT_ID=${MAXMIND_ACCOUNT_ID}
      - GEOIPUPDATE_LICENSE_KEY=${MAXMIND_LICENSE_KEY}
      - GEOIPUPDATE_EDITION_IDS=GeoLite2-City GeoLite2-ASN
      - GEOIPUPDATE_DB_DIR=/var/opt/GeoIP
      - GEOIPUPDATE_FREQUENCY=72

  redis:
    image: redis:7-alpine
    container_name: whoami-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 64mb --maxmemory-policy allkeys-lru

networks:
  admin_public_network:
    external: true

volumes:
  geoip_data:
  whoami_data:
